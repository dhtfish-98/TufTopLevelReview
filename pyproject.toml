[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "cvp-tuf-top-level-review"
version = "0.1.1"
description = "Offline pinned-root Ed25519 TUF 1.x traditional top-level metadata chain, sequential root rotation, independent-key thresholds, expiry, caller-supplied rollback floors, byte hashes and every declared target."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "UPSTREAM_LICENSE"]
readme = "README.md"
dependencies = ["cryptography==50.0.2", "PyNaCl==1.6.2"]
[project.scripts]
tuf-top-level-review = "tuf_top_level_review.cli:entry"
[tool.setuptools.packages.find]
where = ["src"]
